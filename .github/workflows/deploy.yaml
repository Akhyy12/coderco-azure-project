name: Deploy Flask App to Azure

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: pip install -r app/requirements.txt

      # Step 4: Check Python syntax
      - name: Check Python syntax
        run: python -m compileall -q app

      # Step 5: Login to Azure using OIDC
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Step 6: Login to Azure Container Registry
      - name: Login to ACR
        run: az acr login --name omerdev2030

      # Step 7: Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t omerdev2030.azurecr.io/flask-app-v2:${{ github.sha }} \
            ./app

      # Step 8: Push Docker image to ACR
      - name: Push Docker image
        run: |
          docker push \
            omerdev2030.azurecr.io/flask-app-v2:${{ github.sha }}

      # Step 9: Deploy to Azure Container Apps
      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name omer-container-app \
            --resource-group rg-omer-dev \
            --image omerdev2030.azurecr.io/flask-app-v2:${{ github.sha }}

      # Step 10: Verify deployment
      - name: Verify deployed image
        run: |
          az containerapp show \
            --name omer-container-app \
            --resource-group rg-omer-dev \
            --query "properties.template.containers[0].image" \
            -o tsv
