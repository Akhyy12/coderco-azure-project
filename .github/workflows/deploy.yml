name: Deploy to Azure

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name omerdev2030

      - name: Build Docker image
        run: docker build -t omerdev2030.azurecr.io/coderco-azure-project:${{ github.sha }} .

      - name: Push Docker image to ACR
        run: docker push omerdev2030.azurecr.io/coderco-azure-project:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name omer-container-app \
            --resource-group rg-omer-dev \
            --image omerdev2030.azurecr.io/coderco-azure-project:${{ github.sha }}